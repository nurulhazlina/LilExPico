<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LilEx LMS — 5-Student Simulation</title>
<style>
  body { font-family: monospace; background:#1a1a2e; color:#e0e0e0; padding:24px; }
  h1   { color:#00d4ff; margin-bottom:4px; }
  p.sub{ color:#888; margin-top:0; margin-bottom:24px; }
  #run { background:#00d4ff; color:#000; border:none; padding:12px 32px;
         font-size:16px; font-weight:bold; cursor:pointer; border-radius:6px; }
  #run:disabled { background:#444; color:#666; cursor:not-allowed; }
  #log { margin-top:24px; background:#0d0d1a; border:1px solid #333;
         padding:16px; border-radius:8px; max-height:600px; overflow-y:auto; }
  .stu { color:#ffd700; margin-top:14px; font-size:13px; border-top:1px solid #333; padding-top:8px; }
  .ok  { color:#4cff88; }
  .err { color:#ff6b6b; }
  .info{ color:#aaa; }
  #summary { margin-top:16px; padding:12px; background:#0a2a0a;
             border:1px solid #2a6a2a; border-radius:6px; display:none; }
</style>
</head>
<body>

<h1>🎓 LilEx LMS — 5-Student Simulation</h1>
<p class="sub">Sends realistic data to your Google Sheet for all 23 tabs.</p>
<button id="run" onclick="runSim()">▶ Run Simulation</button>

<div id="log"><span class="info">Click "Run Simulation" to start...</span></div>
<div id="summary"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwEKS3VdUL8CaenRJ80wQ7ynRGE2lUNMdNs9BR5iqfMsD_rsu18e17t5JblEiuLP2RM/exec';

const STUDENTS = [
  {matric:'RE25001',name:'Ahmad bin Ali',          gender:'M',age:'19',kelas:'2BET',  mykid:'071203010001',phone:'0123456789',email:'ahmad@student.umpsa.edu.my',  school:'UMPSA',              school_code:'UMPSA',   state:'Pahang'},
  {matric:'RE25002',name:'Nurul Izzati binti Hassan',gender:'F',age:'18',kelas:'3SCI',  mykid:'080512020002',phone:'0134567890',email:'izzati@student.umpsa.edu.my', school:'SMK Shah Alam',      school_code:'SKSA02',  state:'Selangor'},
  {matric:'RE25003',name:'Muhammad Haziq bin Zakaria',gender:'M',age:'20',kelas:'BKTC2',mykid:'060823030003',phone:'0145678901',email:'haziq@student.umpsa.edu.my',  school:'SMK Skudai Johor',   school_code:'SKSJ03',  state:'Johor'},
  {matric:'RE25004',name:'Siti Rahimah binti Mohd', gender:'F',age:'19',kelas:'4SN1',  mykid:'070615040004',phone:'0156789012',email:'rahimah@student.umpsa.edu.my',school:'SMK Alor Setar',      school_code:'SKAS04',  state:'Kedah'},
  {matric:'RE25005',name:'Amirul Faiz bin Ibrahim',  gender:'M',age:'21',kelas:'BEET3',mykid:'051120050005',phone:'0167890123',email:'faiz@student.umpsa.edu.my',    school:'SMK Ipoh Timur',     school_code:'SKIT05',  state:'Perak'},
];

const ACTIVITIES = [
  [1,'Introduction to Raspberry Pi & Python',1],
  [2,'Loops & Timing',1],
  [3,'GPIO Digital Output',2],
  [4,'GPIO Digital Input',2],
  [5,'PWM & Analog Signals',3],
  [6,'Sensors & Data Reading',3],
  [7,'Display & Output Devices',4],
  [8,'Motion & Motor Control',4],
  [9,'Networking Basics',5],
  [10,'APIs & Web Requests',5],
  [11,'Data Logging & Storage',6],
  [12,'Project Planning & Design',6],
  [13,'Final Integrated Project',7],
];

const TIERED = [2,4,5,8,10,13];

const PRE_TEXT  = ['I think I can do most of it','Quite nervous about the coding part','I have some prior experience','Not sure what to expect','Ready to try'];
const MID_TEXT  = ['Breaking problem step by step','Reviewing examples helped','Tried different approaches','Referenced past activities','Trial and error worked'];
const SURPRISE  = ['GPIO was easier than I thought','Timing loops were tricky but doable','Python is more intuitive than expected','Sensors were more fun than expected','Error messages were actually helpful'];
const TRANSFER  = ['I can apply this to my robotics project','Useful for home automation','I want to build a weather station','Can use this in my FYP','Thinking of making a smart alarm system'];
const CAL_REF1  = ['I am confident in my Python basics','I know loops but not GPIO','Some concepts still unclear','I have done similar projects','Need to review timing functions'];
const JR_TEXT   = ['Tiered structure built confidence','Struggled at tier 2 but got through','Concept questions were well designed','Preferred working through challenges','Calibration made me reflect more'];
const REFLECTIONS=['Overall a positive experience','I want to revisit harder tiers','This helped me understand deeply','I feel more confident now','I need more practice on last tier'];

function rnd(lo,hi){return Math.floor(Math.random()*(hi-lo+1))+lo;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function answers(){const a={};for(let i=1;i<=60;i++)a[i]=pick(['A','B','C','D']);return a;}
function sections(){const s={};for(let i=1;i<=6;i++)s['M'+i]=rnd(2,8);return s;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

let ok=0, fail=0;
function log(msg,cls='info'){
  const d=document.getElementById('log');
  d.innerHTML+=`<div class="${cls}">${msg}</div>`;
  d.scrollTop=d.scrollHeight;
}

async function gasPost(payload, label) {
  try {
    await fetch(GAS_URL, {method:'POST', mode:'no-cors', body:JSON.stringify(payload),
                          headers:{'Content-Type':'application/json'}});
    log(`  ✔ ${label}`, 'ok'); ok++;
  } catch(e) {
    log(`  ✘ ${label}: ${e.message}`, 'err'); fail++;
  }
  await sleep(300);
}

async function runSim() {
  document.getElementById('run').disabled = true;
  document.getElementById('log').innerHTML = '';
  document.getElementById('summary').style.display = 'none';
  ok=0; fail=0;

  for (const stu of STUDENTS) {
    log(`<br>── ${stu.name} (${stu.matric}) ──`, 'stu');

    // 1. Registration
    await gasPost({event:'index_register',...stu}, 'Registration → Students tab');

    // 2. Pre-test
    const preSc = rnd(20,40);
    await gasPost({
      event:'pretest_submit', student_matric:stu.matric, student_name:stu.name, student:stu,
      score:preSc, total:60, pct:+(preSc/60*100).toFixed(1),
      sections:sections(),
      outcomes:{PO1:rnd(5,12),PO2:rnd(5,12),PO3:rnd(5,12)},
      answers:answers(),
    }, 'Pre-test → PreTest tab');

    // 3. Regular activities (metacog)
    for (const [id,title,week] of ACTIVITIES) {
      const preC=rnd(2,5), postC=Math.min(5,preC+rnd(-1,2));
      await gasPost({
        phase:'activity_complete',
        student_matric:stu.matric, student_name:stu.name,
        student_gender:stu.gender, student_age:stu.age, student_mykid:stu.mykid,
        student_state:stu.state,   student_class:stu.kelas,
        student_school_code:stu.school_code, student_school:stu.school,
        student_phone:stu.phone,   student_email:stu.email,
        activity_id:String(id),    activity_title:title, week:String(week),
        tier:String(rnd(1,3)),
        pre_confidence:preC,  pre_prediction:pick(PRE_TEXT),
        pre_hardest:`Understanding ${title.split(' ')[0].toLowerCase()} concepts`,
        mid_working:pick(MID_TEXT), mid_reflection:`Found the ${title.split(' ').pop().toLowerCase()} challenging`,
        post_completion:rnd(60,100), post_confidence:postC,
        post_surprise:pick(SURPRISE), post_transfer:pick(TRANSFER),
        calibration_delta:postC-preC, time_on_task_min:rnd(15,55),
      }, `Act${id} metacog → Act${id} tab`);
    }

    // 4. Tiered activities
    for (const n of TIERED) {
      const calPred=rnd(55,95), postPct=rnd(60,100), concept=rnd(5,10);
      await gasPost({
        event:'act_complete', activity:`a${n}`,
        matric:stu.matric, name:stu.name, gender:stu.gender, age:stu.age,
        mykid:stu.mykid, home_state:stu.state, 'class':stu.kelas,
        school_code:stu.school_code, institution_name:stu.school,
        phone:stu.phone, email:stu.email,
        cal_confidence:rnd(50,90), cal_predicted_score:calPred,
        cal_reflection_1:pick(CAL_REF1),
        t1_first_attempt_pct:rnd(40,90), t1_score_pct:rnd(60,100),
        t1_attempts:rnd(1,3), t1_passed:true,
        t2_attempts:rnd(1,3), t2_passed:true,
        t3_attempts:rnd(1,4), t4_attempts:rnd(1,3),
        calibration_delta:postPct-calPred,
        concept_score:concept, concept_pct:+(concept/10*100).toFixed(1),
        post_confidence:rnd(50,90), post_actual_pct:postPct,
        jr1:pick(JR_TEXT), jr2:pick(JR_TEXT), jr3:pick(JR_TEXT),
        reflection_2:pick(REFLECTIONS), ts:Date.now(),
      }, `Act${n} tiered → Act${n}_Tiered tab`);
    }

    // 5. Post-test
    const postSc = rnd(35,55);
    await gasPost({
      event:'posttest_submit', student_matric:stu.matric, student_name:stu.name, student:stu,
      score:postSc, total:60, pct:+(postSc/60*100).toFixed(1),
      sections:sections(),
      outcomes:Object.fromEntries(Array.from({length:12},(_,i)=>['L'+(i+1),rnd(2,5)])),
      openEnded:Object.fromEntries(Array.from({length:4},(_,i)=>['OE'+(i+1),pick(REFLECTIONS)])),
      answers:answers(),
    }, 'Post-test → PostTest tab');
  }

  const sumEl = document.getElementById('summary');
  sumEl.innerHTML = `<b style="color:#4cff88">✔ Simulation complete!</b><br>
    ${ok} POSTs sent OK &nbsp;|&nbsp; ${fail} failed<br>
    <small style="color:#aaa">Check your Google Sheet — all 23 tabs should now have data.</small>`;
  sumEl.style.display = 'block';
  document.getElementById('run').disabled = false;
  document.getElementById('run').textContent = '▶ Run Again';
}
</script>
</body>
</html>
